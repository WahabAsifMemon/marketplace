<app-navbar></app-navbar>

<div class="container">
  <!-- Create Post Button -->
  <div class="button-container">
    <button class="create-post-btn" (click)="openModal(createPostModal)" *ngIf="accessTokenExists">Create Post</button>
  </div>

  <!-- Posts List -->
  <div class="posts-list">
    <div class="post-card" *ngFor="let item of posts">
      <!-- Post Header -->
      <div class="post-header">
        <img [src]="item?.user?.profile_image" alt="User Avatar" class="user-avatar rounded-circle">
        <div class="user-info">
          <div class="user-name fw-bold">{{ item?.user?.first_name }}</div>
          <div class="post-time text-muted">{{ item?.created_at | date }}</div>
        </div>
      </div>

      <!-- Post Content -->
      <div class="post-content mt-2">{{ item?.content }}</div>

      <!-- Post Image -->
      <div class="post-image-container" *ngIf="item?.post_img">
        <img [src]="item?.post_img" alt="Post Image" class="post-image w-100">
      </div>

      <!-- Post Actions -->
      <div class="post-actions mt-2">
        <button 
        class="action-btn me-2" 
        (click)="toggleLike(item)">
        <i class="fa fa-thumbs-up" [class.active]="item.isLiked"></i>
      </button>
    
      <!-- Like Count -->
      <span *ngIf="item.likeCount > 0; else noLikes">
        {{ item.likeCount }} {{ item.likeCount === 1 ? 'Like' : 'Likes' }}
      </span>
    
      <!-- Fallback for No Likes -->
      <ng-template #noLikes>
        <span class="text-muted">0 Likes</span>
      </ng-template>
      
      
        <button class="action-btn"><i class="fa fa-comment"></i> Comment</button>
      </div>

      <!-- Comments Section -->
      <div class="comments-section mt-3">
        <div class="comments-header fw-bold mb-4">Comments</div>
      
        <div class="comment-container mb-4" *ngFor="let comment of item?.comments">
          <!-- Comment Details -->
          <div class="comment-details d-flex align-items-start">
            <img src="../../../../assets/images/user.jpeg" alt="User Avatar" class="user-avatar me-3">
            <div class="comment-content">
              <div class="comment-author fw-bold">{{ comment?.user?.first_name }}</div>
              <div class="comment-text">{{ comment?.comment }}</div>
            </div>
          </div>
      
          <!-- Replies Section -->
          <div class="replies-section mt-3 ms-4" *ngIf="comment?.replies?.length">
            <div class="replies-header fw-bold mb-2">Replies</div>
            <div class="reply-container mb-2" *ngFor="let reply of comment?.replies">
              <div class="reply-details d-flex align-items-start">
                <img src="../../../../assets/images/user.jpeg" alt="User Avatar" class="user-avatar me-3">
                <div class="reply-content">
                  <div class="reply-author fw-bold">{{ reply?.user?.first_name }}</div>
                  <div class="reply-text">{{ reply?.comment }}</div>
                </div>
              </div>
            </div>
          </div>
      
          <!-- Reply Input -->
          <div class="reply-input-container mt-2 ms-4">
            <div class="input-group">
              <input 
                type="text" 
                class="form-control" 
                placeholder="Write a reply..." 
                [(ngModel)]="replyInputText[comment.id]" 
                [attr.aria-label]="'Reply for comment ' + comment.id" />
              <button 
                class="btn btn-sm btn-primary" 
                (click)="sendReply(comment.id)" 
                style="background-color: #1eabfc; border: none;"
                type="button">
                Reply
              </button>
            </div>
          </div>
        </div>
      
        <!-- Comment Input -->
        <div class="comment-input-container mt-4">
          <div class="input-group">
            <input 
              type="text" 
              class="form-control" 
              placeholder="Write a comment..." 
              [(ngModel)]="commentInput[item.id]" 
              [attr.aria-label]="'Comment for post ' + item.id" />
            <button 
              class="btn btn-primary" 
              style="background-color: #1eabfc; border: none;"
              type="button" 
              (click)="sendComment(item.id)">
              Send
            </button>
          </div>
        </div>
      </div>
      
      
      
      
    </div>
  </div>
</div>

<!-- Create Post Modal -->
<ng-template #createPostModal>
  <div class="modal-header">
    <img src="../../../../assets/images/user.jpeg" alt="User Avatar" class="rounded-circle me-3" width="50" height="50">
    <h5 class="modal-title">{{ firstName }}</h5>
    <button type="button" class="btn-close ms-auto" (click)="closeModal()"></button>
  </div>
  <div class="modal-body">
    <form [formGroup]="postForm" (ngSubmit)="submitPost()">
      <div class="form-group mb-3">
        <label for="post-content">Content</label>
        <textarea id="post-content" formControlName="content" class="form-control" placeholder="What's on your mind, Wahab?" rows="4" required></textarea>
      </div>
      <div class="form-group mb-3">
        <label for="post-image">Upload Image</label>
        <input type="file" id="post-image" (change)="onFileSelected($event)" class="form-control" accept="image/*">
      </div>
      <button type="submit" class="btn btn-primary w-100">{{ isLoading ? 'Posting...' : 'Post' }}</button>
    </form>
  </div>
</ng-template>

<app-custom-footer></app-custom-footer>
